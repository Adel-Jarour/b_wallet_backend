services:
  - type: web
    name: b-wallet-backend
    env: node
    plan: free
    region: frankfurt # Or oregon, ohio, singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
      - key: LOG_LEVEL
        value: info
      - key: PAYMENT_GATEWAY_WEBHOOK_SECRET
        sync: false
      # NOTE: Do NOT set PORT here! Render dynamically assigns and injects process.env.PORT at runtime.
